[project]
name = "higgs-agent-factory"
version = "0.0.0"
description = "One-line brief -> Agent Spec -> eval gate -> Eval Card, on Boson's Higgs Realtime API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "livekit-agents==1.8.9",
    "pipecat-boson==0.1.4",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.3",
    "ruff>=0.7",
    # scripts/smoke.py only; runtime dependencies are chosen by the plan, not here.
    "websockets>=13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "live: talks to the real Boson API and spends credits; never run by read-only agents",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor-ref"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["factory"]

[[tool.mypy.overrides]]
module = ["pipecat.*", "pipecat_boson.*"]
ignore_missing_imports = true
follow_untyped_imports = false
